services:
  web:
    build:
      context: .
      target: web-nginx
      args:
        # Set at runtime with --build-arg or leave default to .env baked into image
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-https://api.bluetsch.com}
        VITE_APP_URL: ${VITE_APP_URL:-https://www.bluetsch.com}
        VITE_DEFAULT_TENANT: ${VITE_DEFAULT_TENANT:-green}
        VITE_TENANT_ID: ${VITE_TENANT_ID:-green}
        VITE_RC: ${VITE_RC:-rc_live_732628123a4b4c21931bf0c8196408ec}
    container_name: bluethub-web
    restart: unless-stopped
    ports:
      - "3010:80"
    # For local dev (HMR), uncomment to override the prod image with a dev dev build
    # command: pnpm web:dev

  landing:
    build:
      context: .
      target: landing-nginx
    container_name: bluethub-landing
    restart: unless-stopped
    ports:
      - "3001:80"

  # Local reverse proxy so both apps share port 80
  # nginx-proxy:
  #   image: nginx:alpine
  #   depends_on: [web, landing]
  #   volumes:
  #     - ./nginx/proxy.conf:/etc/nginx/conf.d/default.conf:ro
  #   ports:
  #     - "80:80"

networks:
  default:
    driver: bridge